version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  cooldown:
    default-days: 3
  groups:
    actions:
      patterns:
        - actions/*
    github/codeql-action:
      patterns:
        - github/codeql-action/analyze
        - github/codeql-action/init
        - github/codeql-action/upload-sari
  schedule:
    interval: daily
    time: "06:30"
    timezone: Europe/London
- package-ecosystem: nuget
  directory: "/"
  cooldown:
    default-days: 3
  schedule:
    interval: daily
    time: "06:30"
    timezone: Europe/London
  open-pull-requests-limit: 99
  ignore:
    - dependency-name: "Microsoft.AspNetCore.Authentication.Google"
      update-types: ["version-update:semver-major"]
    - dependency-name: "Microsoft.AspNetCore.Mvc.Testing"
      update-types: ["version-update:semver-major"]
    - dependency-name: "Microsoft.AspNetCore.TestHost"
      update-types: ["version-update:semver-major"]
    - dependency-name: "Microsoft.DotNet.Arcade.Sdk"
    - dependency-name: "Microsoft.DotNet.Helix.Sdk"
    - dependency-name: "Microsoft.IdentityModel.Protocols.OpenIdConnect"
